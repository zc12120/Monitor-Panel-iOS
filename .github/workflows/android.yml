name: Build Android APK
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and verify Android port
        run: bash gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Prepare installable APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Monitor-Panel-Android.apk
          sha256sum Monitor-Panel-Android.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Monitor-Panel-Android
          path: |
            android/Monitor-Panel-Android.apk
            android/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-verification
          path: |
            android/app/build/reports/
            android/app/build/test-results/
            android/app/build/screenshots/
